name: Backend security
on:
  push:
  pull_request:
  schedule:
    - cron: '25 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-linux.txt
      - name: Static security analysis
        run: python -m bandit -r apps config core manage.py scripts -c pyproject.toml
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict --require-hashes --disable-pip --progress-spinner off
      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt --strict --require-hashes --disable-pip --progress-spinner off
      - name: Audit Linux server
        run: python -m pip_audit -r requirements-linux.txt --strict --require-hashes --disable-pip --progress-spinner off
