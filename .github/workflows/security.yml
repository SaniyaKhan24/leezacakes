name: Backend security
on:
  push:
  pull_request:
  schedule:
    - cron: '25 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirement/*.txt
      # requirement/*.txt are version-range manifests (not hash locks), so pip-audit
      # resolves them with pip instead of --require-hashes/--disable-pip.
      - run: python -m pip install -r requirement/development.txt
      - name: Static security analysis
        run: python -m bandit -r apps config core manage.py scripts -c pyproject.toml -x '*/tests/*'
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirement/production.txt --strict --progress-spinner off
      - name: Audit development dependencies
        run: python -m pip_audit -r requirement/development.txt --strict --progress-spinner off
