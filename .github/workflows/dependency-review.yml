name: Dependency review
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    # Available on public repos or eligible private repos with dependency review enabled.
    if: github.event.repository.private == false || vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
